{% extends "base.html" %}
{% block title %}{{ page.title }} - OppoGlobe{% endblock %}
{% block meta %}
    <meta name="description" content="{{ page.meta_description|default:page.title }}">
    <meta name="keywords" content="{{ page.keywords }}">
{% endblock %}
{% block content %}
<div class="container">
    <div class="page-content">
        <h1>{{ page.title }}</h1>
        {{ page.content|safe }}
    </div>
</div>
{% endblock %}
