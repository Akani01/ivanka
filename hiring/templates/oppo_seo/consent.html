<section id="ogCookiePanel" role="region" aria-label="Cookie preferences" hidden tabindex="-1"><strong>Privacy choices</strong><p>Essential features stay available. Choose whether to allow optional advertising and analytics services if they are enabled. You can change this choice using Cookie preferences in the footer.</p><p><a href="/site-cookies/">Read about cookies</a> · <a href="/privacy/">Privacy policy</a></p><div class="og-cookie-actions"><button type="button" data-og-choice="essential">Essential only</button><button type="button" data-og-choice="optional">Allow optional services</button></div></section>
<script>
(function(){
 'use strict';
 if(window.ogOpenCookiePreferences)return;
 var key='og_optional_services_v1', panel=document.getElementById('ogCookiePanel'), previousFocus=null;
 var choice=null;
 try{var saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.version===1&&(saved.choice==='essential'||saved.choice==='optional')&&Date.now()-saved.at<180*86400000&&saved.at<=Date.now())choice=saved.choice;}catch(e){}
 window.ogOptionalServicesAllowed=function(){return choice==='optional';};
 window.ogOpenCookiePreferences=function(){previousFocus=document.activeElement;panel.hidden=false;panel.focus();};
 function select(value){choice=value;try{localStorage.setItem(key,JSON.stringify({version:1,choice:value,at:Date.now()}));}catch(e){}panel.hidden=true;window.dispatchEvent(new CustomEvent('og:privacy-choice',{detail:{optional:value==='optional'}}));if(previousFocus&&previousFocus.isConnected)previousFocus.focus();}
 panel.querySelectorAll('[data-og-choice]').forEach(function(button){button.addEventListener('click',function(){select(button.dataset.ogChoice);});});
 // Integrators must separately gate every optional service, including scripts in base templates.
 window.addEventListener('storage',function(e){if(e.key===key)window.location.reload();});
 if(!choice)panel.hidden=false;
})();
</script>
