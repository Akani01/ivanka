<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - OppoGlobe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .reset-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .reset-header h2 {
            color: #1a1a2e;
            font-weight: 700;
            font-size: 24px;
        }
        .reset-header p {
            color: #666;
            font-size: 15px;
        }
        .form-control {
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .password-requirements {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .password-requirements ul {
            padding-left: 20px;
            margin: 5px 0;
        }
        .password-requirements li {
            margin: 2px 0;
        }
        .password-requirements li.valid {
            color: #28a745;
        }
        .password-requirements li.invalid {
            color: #dc3545;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="reset-header">
            <div class="icon">🔑</div>
            <h2>Set New Password</h2>
            <p>Create a new password for your account</p>
        </div>

        <div id="alertContainer"></div>

        <form id="resetPasswordForm">
            <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold">New Password</label>
                <input type="password" class="form-control" id="newPassword" 
                       placeholder="Enter new password" required minlength="8">
                <div class="password-requirements">
                    <ul>
                        <li id="req-length">✓ At least 8 characters</li>
                        <li id="req-number">✗ At least one number</li>
                        <li id="req-uppercase">✗ At least one uppercase letter</li>
                        <li id="req-lowercase">✗ At least one lowercase letter</li>
                    </ul>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" 
                       placeholder="Confirm new password" required>
                <div id="passwordMatch" class="mt-1" style="font-size: 14px;"></div>
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <i class="fas fa-check me-2"></i> Reset Password
            </button>
        </form>

        <a href="/" class="back-link">
            <i class="fas fa-arrow-left me-2"></i> Back to Login
        </a>
    </div>

    <script>
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const colors = {
                success: { bg: '#d1fae5', border: '#10b981', text: '#065f46' },
                danger: { bg: '#fee2e2', border: '#ef4444', text: '#991b1b' },
                info: { bg: '#dbeafe', border: '#3b82f6', text: '#1e40af' }
            };
            const color = colors[type] || colors.info;
            
            container.innerHTML = `
                <div class="alert" style="background: ${color.bg}; border-left: 4px solid ${color.border}; color: ${color.text};">
                    ${message}
                </div>
            `;
        }

        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') return decodeURIComponent(value);
            }
            return null;
        }

        // Get uid and token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const token = urlParams.get('token');

        // Password validation
        document.getElementById('newPassword').addEventListener('input', function() {
            const pwd = this.value;
            
            const reqLength = document.getElementById('req-length');
            const reqNumber = document.getElementById('req-number');
            const reqUppercase = document.getElementById('req-uppercase');
            const reqLowercase = document.getElementById('req-lowercase');
            
            reqLength.className = pwd.length >= 8 ? 'valid' : 'invalid';
            reqNumber.className = /\d/.test(pwd) ? 'valid' : 'invalid';
            reqUppercase.className = /[A-Z]/.test(pwd) ? 'valid' : 'invalid';
            reqLowercase.className = /[a-z]/.test(pwd) ? 'valid' : 'invalid';
            
            // Check password match
            checkPasswordMatch();
        });

        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

        function checkPasswordMatch() {
            const pwd = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const matchEl = document.getElementById('passwordMatch');
            
            if (confirm.length === 0) {
                matchEl.textContent = '';
                matchEl.style.color = '';
                return;
            }
            
            if (pwd === confirm) {
                matchEl.textContent = '✓ Passwords match';
                matchEl.style.color = '#28a745';
            } else {
                matchEl.textContent = '✗ Passwords do not match';
                matchEl.style.color = '#dc3545';
            }
        }

        // Form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            
            // Validate
            if (newPassword.length < 8) {
                showAlert('Password must be at least 8 characters long.', 'danger');
                return;
            }
            
            if (!/\d/.test(newPassword)) {
                showAlert('Password must contain at least one number.', 'danger');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match.', 'danger');
                return;
            }
            
            if (!uid || !token) {
                showAlert('Invalid reset link. Please request a new one.', 'danger');
                return;
            }
            
            // Submit
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Resetting...';
            
            try {
                const response = await fetch('/api/auth/password-reset-confirm/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCSRFToken()
                    },
                    body: JSON.stringify({
                        uid: uid,
                        token: token,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('✅ ' + data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/?reset=success';
                    }, 3000);
                } else {
                    showAlert('❌ ' + data.error, 'danger');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check me-2"></i> Reset Password';
            }
        });

        // Validate token on load
        document.addEventListener('DOMContentLoaded', async function() {
            if (!uid || !token) {
                showAlert('Invalid reset link. Please request a new one.', 'danger');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/password-reset-validate/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCSRFToken()
                    },
                    body: JSON.stringify({ uid, token })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    showAlert('This reset link has expired. Please request a new one.', 'danger');
                    document.getElementById('resetBtn').disabled = true;
                } else {
                    showAlert('🔐 Valid reset link. Please create your new password.', 'info');
                }
            } catch (error) {
                showAlert('Error validating link. Please try again.', 'danger');
            }
        });
    </script>

  <script src="/static/hiring/js/notifications-global.js" defer></script>
</body>
</html>
