<!doctype html>
<html lang="en">
  <meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Ivanka — Offline
  </title>
  <body
    style="
      font-family: Arial;
      background: #faf9f6;
      color: #173d2d;
      padding: 15vh 10%;
    "
  >
    <h1 style="font-size: 55px; letter-spacing: -3px">ivanka.</h1>
    <h2>A little pause.</h2>

      You’re offline. Reconnect to browse, check orders or complete payment.

        padding: 15px 25px;

        color: white;
        border: 0;
        border-radius: 40px;
      "
    >
      Try again ↗
    </button>
