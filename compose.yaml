services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ivanka
      POSTGRES_USER: ivanka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivanka"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_DB: ivanka
      POSTGRES_USER: ivanka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  media:
  staticfiles:
